name: daily

on:
  schedule:
    - cron: '23 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "wizardstrike1"
          git config user.email "124199566+wizardstrike1@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last_run
          git add last_run
          git commit -m "daily"
          git push
