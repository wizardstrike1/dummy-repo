name: daily

on:
  schedule:
    - cron: '23 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "wizardstrike1"
          git config user.email "124199566+wizardstrike1@users.noreply.github.com"
          N=$(( ( $(date -u +%s) - $(date -u -d '2026-07-26' +%s) ) / 86400 + 1 ))
          echo "day: $N" > README.md
          if ! git diff --quiet; then
            git add README.md
            git commit -m "day $N"
            git push
          fi
